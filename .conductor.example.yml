version: "1"

# ——————————————————— config metadata ———————————————————
name: "Conductor Example"
description: "Example config demonstrating a simple full-stack dev setup"
author: "your-github-handle"
keywords: [example, demo]
tags: [nodejs]

# Sensitive environment variable names that should be masked everywhere
env_secrets:
  - API_TOKEN

# Global env — merged into every command's environment
global_env:
  LOG_LEVEL: info

# ——————————————————— commands (root level) ——————————————–
# Commands are defined here once and referenced by profiles via command_ids.
# A command's id is what other commands (in deps[]) and profiles use to refer to it.

commands:
  # ───────────── service: background job —————————————
  - id: echo-hello
    name: "Hello World"
    description: "A simple example that prints a message then exits."
    run: "echo 'Hello from Conductor!' && sleep 2 && echo 'Done.'"
    shell: true

  # ───────────── service: task that waits for hello ————
  - id: echo-world
    name: "Second Task"
    description: "Runs after echo-hello finishes successfully."
    run: "echo 'Running second task...'"
    shell: true
    deps: [echo-hello]

  # ───────────── service: local database ——————–
  - id: db
    name: "Example Database"
    description: "PostgreSQL container for local development."
    run: docker compose up -d postgres
    healthcheck:
      type: port # wait for a TCP port to accept connections
      port: 5432
      interval_ms: 1000 # probe every second
      timeout_ms: 30000 # give 30 seconds total
      retries: 30

  # ───────── service that depends on the database ————–
  - id: api
    name: "Example API"
    description: "Node.js Express API server."
    run: npm run dev
    cwd: ./api # working dir, resolved relative to base_path
    deps: [db] # wait for db to be healthy before this starts
    env_overrides: # per-command overrides on top of global_env + profile env
      NODE_ENV: development
    healthcheck:
      type: http # poll an HTTP endpoint until it responds with 2xx/3xx
      url: "http://localhost:3001/health"
      interval_ms: 500
      timeout_ms: 30000
      retries: 30
    stop_timeout_ms: 5000

# ———————————————————- profiles (selectors) ——————————————–
# A profile contains only env overrides and a list of command ids to run.
# Commands are resolved in dependency order regardless of the array ordering.

profiles:
  dev:
    description: "Local development"
    env:
      NODE_ENV: development
    command_ids: [db, api] # runs db → api (deps enforced)
    # Note: echo-hello and echo-world are not included; run them separately with 'conductor run <profile> echo-hello'

  task: # a second profile that only runs non-web commands
    description: "Simple tasks without a database"
    command_ids: [echo-hello, echo-world]
