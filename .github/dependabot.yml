version: 2
updates:
  # Root workspace manifest
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint can't load TypeScript 7 yet (typescript-eslint/typescript-eslint#10940).
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # Packages
  - package-ecosystem: "npm"
    directory: "/packages/cli"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/packages/core"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/packages/desktop"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint can't load TypeScript 7 yet (typescript-eslint/typescript-eslint#10940).
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: "npm"
    directory: "/packages/ui"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
